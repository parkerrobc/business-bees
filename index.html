<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Bees - Subscribe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background floating bees -->
    <div class="background-bees">
        <img src="assets/bee-float-1.png" alt="" class="bg-bee bee-1">
        <img src="assets/bee-float-2.png" alt="" class="bg-bee bee-2">
        <img src="assets/bee-float-3.png" alt="" class="bg-bee bee-3">
        <img src="assets/bee-float-4.png" alt="" class="bg-bee bee-4">
        <img src="assets/bee-float-5.png" alt="" class="bg-bee bee-5">
        <img src="assets/bee-float-6.png" alt="" class="bg-bee bee-6">
        <img src="assets/bee-float-7.png" alt="" class="bg-bee bee-7">
        <img src="assets/bee-float-8.png" alt="" class="bg-bee bee-8">
        <img src="assets/bee-float-9.png" alt="" class="bg-bee bee-9">
        <img src="assets/bee-float-10.png" alt="" class="bg-bee bee-10">
        <img src="assets/bee-float-1.png" alt="" class="bg-bee bee-11">
        <img src="assets/bee-float-2.png" alt="" class="bg-bee bee-12">
        <img src="assets/bee-float-3.png" alt="" class="bg-bee bee-13">
        <img src="assets/bee-float-4.png" alt="" class="bg-bee bee-14">
        <img src="assets/bee-float-5.png" alt="" class="bg-bee bee-15">
        <img src="assets/bee-float-6.png" alt="" class="bg-bee bee-16">
        <img src="assets/bee-float-7.png" alt="" class="bg-bee bee-17">
        <img src="assets/bee-float-8.png" alt="" class="bg-bee bee-18">
        <img src="assets/bee-float-9.png" alt="" class="bg-bee bee-19">
        <img src="assets/bee-float-10.png" alt="" class="bg-bee bee-20">
    </div>
    
    <div class="container">
        <div class="content">
            <!-- Bee decorations -->
            <div class="bee-decoration bee-left">
                <img src="assets/bee-1.png" alt="Bee" class="floating-bee">
            </div>
            <div class="bee-decoration bee-right">
                <img src="assets/bee-2.png" alt="Bee" class="floating-bee-reverse">
            </div>

            <!-- Main content -->
            <div class="main-content">
                <div class="logo">
                    <img src="assets/bee-logo.png" alt="Business Bees Logo" class="logo-bee">
                </div>
                
                <h1 class="title">Business Bees</h1>
                
                <p class="description">
                    Subscribe to our mailing list so you can receive updates about the game's progress, rules, and more!
                </p>

                <!-- Subscription form -->
                <form id="subscribeForm" class="subscribe-form">
                    <div class="form-group">
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="Enter your email address"
                            required
                            class="email-input"
                        >
                        <button type="submit" class="subscribe-button">
                            Subscribe
                            <img src="assets/bee-icon.png" alt="" class="button-icon">
                        </button>
                    </div>
                    <div id="message" class="message"></div>
                </form>

                <!-- Honeycomb pattern decoration -->
                <div class="honeycomb-pattern"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
